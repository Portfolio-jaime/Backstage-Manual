apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: monitoring
stringData:
  admin-user: admin
  admin-password: __INJECT_SECURE_PASSWORD__

# NOTA:
# - Sustituye __INJECT_SECURE_PASSWORD__ por una contraseña fuerte antes de aplicar.
# - No comprometas la contraseña real en el repositorio; puedes mantener este archivo con placeholder y usar un proceso externo
#   (kubectl patch / kustomize / sealed-secrets / ExternalSecrets) para injectar la credencial final.
# - El chart de grafana usará este secreto gracias a la configuración admin.existingSecret en values.yaml.
