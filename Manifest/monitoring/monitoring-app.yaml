apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/arheanja/Backstage-solutions.git'
    targetRevision: HEAD
    path: Manifest/monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: backstage-manual
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
