apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  ignoreDifferences:
    # Large CRDs whose rendered manifests exceed the annotation size limit when ArgoCD attempts strategic merge apply.
    # We ignore metadata.annotations diffs to prevent repeated SyncFailed errors.
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: prometheuses.monitoring.coreos.com
      jsonPointers:
        - /metadata/annotations
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: scrapeconfigs.monitoring.coreos.com
      jsonPointers:
        - /metadata/annotations
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: alertmanagers.monitoring.coreos.com
      jsonPointers:
        - /metadata/annotations
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: alertmanagerconfigs.monitoring.coreos.com
      jsonPointers:
        - /metadata/annotations
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: prometheusagents.monitoring.coreos.com
      jsonPointers:
        - /metadata/annotations
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: thanosrulers.monitoring.coreos.com
      jsonPointers:
        - /metadata/annotations
  sources:
    - chart: kube-prometheus-stack
      repoURL: https://prometheus-community.github.io/helm-charts
      targetRevision: 65.0.0
      helm:
        valueFiles:
          - $values/Manifest/monitoring/values.yaml
    - repoURL: https://github.com/Portfolio-jaime/Backstage-Manual
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      # Use server-side apply so that Kubernetes stores field ownership in managedFields
      # instead of the kubectl.kubernetes.io/last-applied-configuration annotation.
      # This prevents oversized annotation errors on large CRDs (Prometheus ecosystem CRDs).
      - ServerSideApply=true
      # (Removed Replace=true; server-side apply already avoids client-side last-applied annotation bloat.)
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
