apiVersion: v1
kind: Secret
metadata:
  name: backstage-secret
  namespace: backstage-manual
type: Opaque
# Manifiesto sin secretos reales. Usa un mecanismo externo para inyectarlos (kubectl create secret, SealedSecrets, ExternalSecrets, etc.).
# GitHub Push Protection bloqueó el PAT anterior: lo hemos eliminado y ahora quedan placeholders.
stringData:
  BACKEND_AUTH_KEYS_0_SECRET: "__ROTATE_AND_INJECT__"
  # Eliminado BACKEND_AUTH_SECRET (uso de mecanismo moderno auth.keys)
  GITHUB_CLIENT_ID: "__INJECT_AT_DEPLOY_TIME__"
  GITHUB_CLIENT_SECRET: "__INJECT_AT_DEPLOY_TIME__"
  GITHUB_TOKEN: "__DO_NOT_COMMIT_PAT__"
