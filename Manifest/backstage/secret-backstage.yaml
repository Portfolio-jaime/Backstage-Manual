apiVersion: v1
kind: Secret
metadata:
  name: backstage-secret
  namespace: backstage-manual
type: Opaque
stringData:
  # PAT para integraciones (no usado para OAuth login)
  GITHUB_TOKEN: "replace-with-pat-or-remove"
  BACKEND_AUTH_SECRET: "secret_key_backStage"
  BACKEND_AUTH_KEYS_0_SECRET: "secret_key_backStage"
  # Estos dos valores deben inyectarse fuera del repo usando el script Scripts/create_k8s_backstage_secret.sh
  # Nunca committees el Client Secret real.
  GITHUB_CLIENT_ID: "__INJECT_AT_DEPLOY_TIME__"
  GITHUB_CLIENT_SECRET: "__INJECT_AT_DEPLOY_TIME__"