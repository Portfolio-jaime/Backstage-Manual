## Example Secret (DO NOT APPLY DIRECTLY)
# This file is an example template only. It is NOT applied by ArgoCD because
# we removed the real secret manifest to avoid overwriting runtime values.
#
# Recommended production approaches (pick ONE):
#  1. SealedSecret (kubeseal) -> commit encrypted secret
#  2. ExternalSecrets -> pull from external secret manager
#  3. Manual kubectl create secret + annotate with argocd sync options to prevent prune
#
# If you choose temporary manual management:
#   kubectl -n backstage-manual create secret generic backstage-secret \
#     --from-literal=BACKEND_AUTH_KEYS_0_SECRET="<random-long-secret>" \
#     --from-literal=GITHUB_CLIENT_ID="<client_id>" \
#     --from-literal=GITHUB_CLIENT_SECRET="<client_secret>" \
#     --from-literal=GITHUB_TOKEN="<github_pat_with_min_scopes>"
#   kubectl -n backstage-manual annotate secret backstage-secret \
#     argocd.argoproj.io/sync-options='Prune=false'
#
# Never commit real secret values here.
apiVersion: v1
kind: Secret
metadata:
  name: backstage-secret
  namespace: backstage-manual
  annotations:
    # Ensures if someone accidentally applies this placeholder it won't be pruned during transition.
    argocd.argoproj.io/sync-options: Prune=false
type: Opaque
stringData:
  BACKEND_AUTH_KEYS_0_SECRET: "__REPLACE__"
  GITHUB_CLIENT_ID: "__REPLACE__"
  GITHUB_CLIENT_SECRET: "__REPLACE__"
  GITHUB_TOKEN: "__REPLACE__"