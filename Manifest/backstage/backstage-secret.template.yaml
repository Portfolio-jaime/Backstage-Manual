apiVersion: v1
kind: Secret
metadata:
  name: backstage-secret
  namespace: backstage-manual
  annotations:
    backstage.io/description: "Template – Rellenar vía pipeline o herramienta de secretos. NO usar en producción con valores planos."
type: Opaque
stringData:
  # Generar con: openssl rand -hex 32
  BACKEND_AUTH_KEYS_0_SECRET: "CHANGEME_GENERATE_STRONG_HEX"
  # GitHub OAuth App credentials (Settings > Developer settings > OAuth Apps)
  GITHUB_CLIENT_ID: "CHANGEME_GITHUB_OAUTH_CLIENT_ID"
  GITHUB_CLIENT_SECRET: "CHANGEME_GITHUB_OAUTH_CLIENT_SECRET"
  # PAT mínimo read:org (ideal fine‑grained). Evitar scopes innecesarios.
  GITHUB_TOKEN: "CHANGEME_GH_PAT"

# Uso sugerido:
# kubectl -n backstage-manual create secret generic backstage-secret \
#   --from-literal=BACKEND_AUTH_KEYS_0_SECRET="$(openssl rand -hex 32)" \
#   --from-literal=GITHUB_CLIENT_ID="<id>" \
#   --from-literal=GITHUB_CLIENT_SECRET="<secret>" \
#   --from-literal=GITHUB_TOKEN="<pat>"
# Luego:
# kubectl -n backstage-manual rollout restart deploy/backstage
