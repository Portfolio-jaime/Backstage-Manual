name: Build and Push Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Display build context
        run: |
          echo "🔍 Build context information:"
          echo "  Context: ."
          echo "  Dockerfile: ./IDP/Dockerfile"
          echo "  Working directory: $(pwd)"
          echo "  Files in root:"
          ls -la | head -10

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract commit hash
        id: vars
        run: |
          echo "commit_hash=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "📋 Commit information:"
          echo "  Hash: $(git rev-parse --short HEAD)"
          echo "  Author: $(git log -1 --pretty=format:'%an <%ae>')"
          echo "  Message: $(git log -1 --pretty=format:'%s')"
          echo "  Date: $(git log -1 --pretty=format:'%ad' --date=short)"

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v5
        with:
          context: ./IDP
          file: ./IDP/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            jaimehenao8126/backstage-custom:latest
            jaimehenao8126/backstage-custom:${{ steps.vars.outputs.commit_hash }}

      - name: Clean failed pods and ReplicaSets after rollout
        if: failure()
        run: |
          kubectl delete pod -n backstage-manual --field-selector=status.phase=Failed
          kubectl delete rs -n backstage-manual --field-selector=status.replicas=0
      - name: Output build information
        run: |
          echo "✅ Docker image built and pushed successfully!"
          echo "📦 Image tags:"
          echo "  - jaimehenao8126/backstage-custom:latest"
          echo "  - jaimehenao8126/backstage-custom:${{ steps.vars.outputs.commit_hash }}"
          echo "🔗 Commit hash: ${{ steps.vars.outputs.commit_hash }}"
          echo "📊 Build completed at: $(date)"

      - name: Update Backstage manifest with new image tag
        run: |
          sed -i "s|image: jaimehenao8126/backstage-custom:.*|image: jaimehenao8126/backstage-custom:${{ steps.vars.outputs.commit_hash }}|" Manifest/backstage/deploy-backstage.yaml

      - name: Commit and push manifest update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.email "github-actions@users.noreply.github.com"
          git config --global user.name "github-actions"
          git add Manifest/deploy-backstage.yaml
          git commit -m "Update Backstage image tag to ${{ steps.vars.outputs.commit_hash }}"
            git push
  
      - name: Workflow summary
        run: |
            echo "### 🚀 Backstage Build & Deploy Summary" >> $GITHUB_STEP_SUMMARY
            echo "**Commit:** ${{ steps.vars.outputs.commit_hash }}" >> $GITHUB_STEP_SUMMARY
            echo "**Docker Tags:**" >> $GITHUB_STEP_SUMMARY
            echo "- jaimehenao8126/backstage-custom:latest" >> $GITHUB_STEP_SUMMARY
            echo "- jaimehenao8126/backstage-custom:${{ steps.vars.outputs.commit_hash }}" >> $GITHUB_STEP_SUMMARY
            echo "**Platforms:** linux/amd64, linux/arm64" >> $GITHUB_STEP_SUMMARY
            echo "**Manifest Updated:** Manifest/deploy-backstage.yaml" >> $GITHUB_STEP_SUMMARY
            echo "**ArgoCD App:** backstage (namespace: argocd)" >> $GITHUB_STEP_SUMMARY
            echo "**K8s Namespace:** backstage-manual" >> $GITHUB_STEP_SUMMARY
            echo "**Build Time:** $(date)" >> $GITHUB_STEP_SUMMARY
