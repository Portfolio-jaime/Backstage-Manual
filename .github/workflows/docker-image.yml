name: Build and Push Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract commit hash
        id: vars
        run: echo "commit_hash=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./IDP
          file: ./IDP/Dockerfile
          push: true
          tags: |
            jaimehenao8126/backstage-custom:latest
            jaimehenao8126/backstage-custom:${{ steps.vars.outputs.commit_hash }}

      - name: Update Backstage manifest with new image tag
        run: |
          sed -i "s|image: jaimehenao8126/backstage-custom:.*|image: jaimehenao8126/backstage-custom:${{ steps.vars.outputs.commit_hash }}|" Manifest/deploy-backstage.yaml

      - name: Commit and push manifest update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.email "github-actions@users.noreply.github.com"
          git config --global user.name "github-actions"
          git add Manifest/deploy-backstage.yaml
          git commit -m "Update Backstage image tag to ${{ steps.vars.outputs.commit_hash }}"
          git push
